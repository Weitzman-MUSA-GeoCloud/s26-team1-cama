main:
  steps:
    - init:
        assign:
          - project_id: "musa5090s26-team1"
          - region: "us-east4"
          - opa_properties_extract_url: "https://extract-opa-properties-bl43esqwsa-uk.a.run.app"
          - opa_properties_prepare_url: "https://prepare-opa-properties-bl43esqwsa-uk.a.run.app"
          - opa_properties_load_url: "https://load-opa-properties-bl43esqwsa-uk.a.run.app"
          - opa_assessments_extract_url: "https://extract-opa-assessments-bl43esqwsa-uk.a.run.app"
          - opa_assessments_prepare_url: "https://prepare-opa-assessments-bl43esqwsa-uk.a.run.app"
          - opa_assessments_load_url: "https://load-opa-assessments-bl43esqwsa-uk.a.run.app"
          - pwd_parcels_extract_url: "https://extract-pwd-parcels-bl43esqwsa-uk.a.run.app"
          - pwd_parcels_prepare_url: "https://prepare-pwd-parcels-bl43esqwsa-uk.a.run.app"
          - pwd_parcels_load_url: "https://load-pwd-parcels-bl43esqwsa-uk.a.run.app"
          - transform_model_training_data_url: "https://transform-model-training-data-bl43esqwsa-uk.a.run.app"
          - transform_tax_year_assessment_bins_url: "https://transform-tax-year-assessment-bins-bl43esqwsa-uk.a.run.app"
          - transform_current_assessment_bins_url: "https://transform-current-assessment-bins-bl43esqwsa-uk.a.run.app"
          - export_tax_year_assessment_bins_url: "https://export-tax-year-assessment-bins-bl43esqwsa-uk.a.run.app"
          - export_current_assessment_bins_url: "https://export-current-assessment-bins-bl43esqwsa-uk.a.run.app"
          - export_property_tile_info_url: "https://export-property-tile-info-bl43esqwsa-uk.a.run.app"
          - export_map_style_metadata_url: "https://export-map-style-metadata-bl43esqwsa-uk.a.run.app"
          - predict_current_assessments_job: "predict-current-assessments"
          - generate_property_map_tiles_job: "generate-property-map-tiles"
          - opa_properties_extract_result: null
          - opa_properties_prepare_result: null
          - opa_properties_load_result: null
          - opa_assessments_extract_result: null
          - opa_assessments_prepare_result: null
          - opa_assessments_load_result: null
          - pwd_parcels_extract_result: null
          - pwd_parcels_prepare_result: null
          - pwd_parcels_load_result: null
          - transform_model_training_data_result: null
          - predict_current_assessments_result: null
          - transform_tax_year_assessment_bins_result: null
          - transform_current_assessment_bins_result: null
          - export_tax_year_assessment_bins_result: null
          - export_current_assessment_bins_result: null
          - export_property_tile_info_result: null
          - export_map_style_metadata_result: null
          - generate_property_map_tiles_result: null

    - run_ingest_pipelines:
        parallel:
          shared:
            - opa_properties_extract_result
            - opa_properties_prepare_result
            - opa_properties_load_result
            - opa_assessments_extract_result
            - opa_assessments_prepare_result
            - opa_assessments_load_result
            - pwd_parcels_extract_result
            - pwd_parcels_prepare_result
            - pwd_parcels_load_result
          branches:
            - opa_properties:
                steps:
                  - extract_opa_properties:
                      call: http.post
                      args:
                        url: ${opa_properties_extract_url}
                        auth:
                          type: OIDC
                        timeout: 1800
                        body: {}
                      result: opa_properties_extract_result

                  - prepare_opa_properties:
                      call: http.post
                      args:
                        url: ${opa_properties_prepare_url}
                        auth:
                          type: OIDC
                        timeout: 1800
                        body: {}
                      result: opa_properties_prepare_result

                  - load_opa_properties:
                      call: http.post
                      args:
                        url: ${opa_properties_load_url}
                        auth:
                          type: OIDC
                        timeout: 1800
                        body: {}
                      result: opa_properties_load_result

            - opa_assessments:
                steps:
                  - extract_opa_assessments:
                      call: http.post
                      args:
                        url: ${opa_assessments_extract_url}
                        auth:
                          type: OIDC
                        timeout: 1800
                        body: {}
                      result: opa_assessments_extract_result

                  - prepare_opa_assessments:
                      call: http.post
                      args:
                        url: ${opa_assessments_prepare_url}
                        auth:
                          type: OIDC
                        timeout: 1800
                        body: {}
                      result: opa_assessments_prepare_result

                  - load_opa_assessments:
                      call: http.post
                      args:
                        url: ${opa_assessments_load_url}
                        auth:
                          type: OIDC
                        timeout: 1800
                        body: {}
                      result: opa_assessments_load_result

            - pwd_parcels:
                steps:
                  - extract_pwd_parcels:
                      call: http.post
                      args:
                        url: ${pwd_parcels_extract_url}
                        auth:
                          type: OIDC
                        timeout: 1800
                        body: {}
                      result: pwd_parcels_extract_result

                  - prepare_pwd_parcels:
                      call: http.post
                      args:
                        url: ${pwd_parcels_prepare_url}
                        auth:
                          type: OIDC
                        timeout: 1800
                        body: {}
                      result: pwd_parcels_prepare_result

                  - load_pwd_parcels:
                      call: http.post
                      args:
                        url: ${pwd_parcels_load_url}
                        auth:
                          type: OIDC
                        timeout: 1800
                        body: {}
                      result: pwd_parcels_load_result

    - transform_model_training_data:
        call: http.post
        args:
          url: ${transform_model_training_data_url}
          auth:
            type: OIDC
          timeout: 1800
          body: {}
        result: transform_model_training_data_result

    - predict_current_assessments:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project_id + "/locations/" + region + "/jobs/" + predict_current_assessments_job}
          body: {}
          connector_params:
            timeout: 1800
        result: predict_current_assessments_result

    - build_dashboard_assets:
        parallel:
          shared:
            - transform_tax_year_assessment_bins_result
            - transform_current_assessment_bins_result
            - export_tax_year_assessment_bins_result
            - export_current_assessment_bins_result
            - export_property_tile_info_result
            - export_map_style_metadata_result
            - generate_property_map_tiles_result
          branches:
            - tax_year_chart:
                steps:
                  - transform_tax_year_assessment_bins:
                      call: http.post
                      args:
                        url: ${transform_tax_year_assessment_bins_url}
                        auth:
                          type: OIDC
                        timeout: 1800
                        body: {}
                      result: transform_tax_year_assessment_bins_result

                  - export_tax_year_assessment_bins:
                      call: http.post
                      args:
                        url: ${export_tax_year_assessment_bins_url}
                        auth:
                          type: OIDC
                        timeout: 1800
                        body: {}
                      result: export_tax_year_assessment_bins_result

            - current_chart:
                steps:
                  - transform_current_assessment_bins:
                      call: http.post
                      args:
                        url: ${transform_current_assessment_bins_url}
                        auth:
                          type: OIDC
                        timeout: 1800
                        body: {}
                      result: transform_current_assessment_bins_result

                  - export_current_assessment_bins:
                      call: http.post
                      args:
                        url: ${export_current_assessment_bins_url}
                        auth:
                          type: OIDC
                        timeout: 1800
                        body: {}
                      result: export_current_assessment_bins_result

            - property_tiles:
                steps:
                  - export_property_tile_info:
                      call: http.post
                      args:
                        url: ${export_property_tile_info_url}
                        auth:
                          type: OIDC
                        timeout: 1800
                        body: {}
                      result: export_property_tile_info_result

                  - generate_property_map_tiles:
                      call: googleapis.run.v2.projects.locations.jobs.run
                      args:
                        name: ${"projects/" + project_id + "/locations/" + region + "/jobs/" + generate_property_map_tiles_job}
                        body: {}
                        connector_params:
                          timeout: 3600
                      result: generate_property_map_tiles_result

            - map_style_metadata:
                steps:
                  - export_map_style_metadata:
                      call: http.post
                      args:
                        url: ${export_map_style_metadata_url}
                        auth:
                          type: OIDC
                        timeout: 1800
                        body: {}
                      result: export_map_style_metadata_result

    - done:
        return:
          ingest:
            opa_properties:
              extract: ${opa_properties_extract_result.body}
              prepare: ${opa_properties_prepare_result.body}
              load: ${opa_properties_load_result.body}
            opa_assessments:
              extract: ${opa_assessments_extract_result.body}
              prepare: ${opa_assessments_prepare_result.body}
              load: ${opa_assessments_load_result.body}
            pwd_parcels:
              extract: ${pwd_parcels_extract_result.body}
              prepare: ${pwd_parcels_prepare_result.body}
              load: ${pwd_parcels_load_result.body}
          transforms:
            model_training_data: ${transform_model_training_data_result.body}
            tax_year_assessment_bins: ${transform_tax_year_assessment_bins_result.body}
            current_assessment_bins: ${transform_current_assessment_bins_result.body}
          model:
            predict_current_assessments: ${predict_current_assessments_result}
          exports:
            tax_year_assessment_bins: ${export_tax_year_assessment_bins_result.body}
            current_assessment_bins: ${export_current_assessment_bins_result.body}
            property_tile_info: ${export_property_tile_info_result.body}
            map_style_metadata: ${export_map_style_metadata_result.body}
          jobs:
            generate_property_map_tiles: ${generate_property_map_tiles_result}
